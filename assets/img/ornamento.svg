<!-- Ornamento separador medieval (SVG): se usa como divisor entre secciones -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 24" width="300" height="24">
  <!-- Línea izquierda -->
  <path d="M0 12 H120" stroke="#7a1e1e" stroke-width="2"/>
  <!-- Línea derecha -->
  <path d="M180 12 H300" stroke="#7a1e1e" stroke-width="2"/>
  <!-- Rombo central dorado -->
  <path d="M150 2 L162 12 L150 22 L138 12 Z" fill="#b8892b" stroke="#2b1d12" stroke-width="1.5"/>
  <!-- Puntos laterales -->
  <circle cx="128" cy="12" r="3" fill="#7a1e1e"/>
  <circle cx="172" cy="12" r="3" fill="#7a1e1e"/>
</svg>
